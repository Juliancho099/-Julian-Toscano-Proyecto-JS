<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <title>Acai Store</title>
</head>

<body>
    <article class="contenedro" id="contenedor">
        <header class="contenedor__header">
            <nav class="nav">
                <a href="../index.html" class="nav__logo" id="carrito-volver"><i class="bi bi-box-arrow-left"></i></a>
            </nav>
        </header>

        <section class="carrito">
            <h1 class="carrito__titulo">Carrito De Compras</h1>

            <div class="carrito__productos">
                <template class="plantillaCarrito">
                    <div class="producto">

                        <img src="../sources/acaiLogo.jpeg" alt="" class="producto__img">

                        <div class="producto__titulo">
                            <small>Tirulo</small>
                            <h3 class="titulo">Harper Acai</h3>
                        </div>
                        <div class="producto__cantidad">
                            <small>Cantidad</small>
                            <p class="cantidad">1</p>
                        </div>
                        <div class="producto__precio">
                            <small>Precio</small>
                            <p class="precio">$7000</p>
                        </div>
                        <div class="producto__subtotal">
                            <small>Subtotal</small>
                            <p class="subtotal">$7000</p>
                        </div>
                        <button class="producto__eliminar"><i class="bi bi-trash3"></i></i></button>
                    </div>
                </template>
            </div>

            <div class="carrito__acciones">
                <div class="carrito__izquierda">
                    <button class="carrito__vaciar">Vaciar carrito</button>
                </div>
                <div class="carrito__derecha">
                    <div class="carrito__total">
                        <p>total</p>
                        <p id="carrito-total">$14000</p>
                    </div>
                    <button class="carrito__comprar">Comprar</button>
                </div>
            </div>


        </section>
    </article>

    <!-- AlertasSweet -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/carrito.js"></script>
</body>

</html>
